stages:
  - validate

validate-skills:
  stage: validate
  image: python:3.12-slim
  before_script:
    - apt-get update --quiet
    - apt-get install --quiet --yes --no-install-recommends git
  script:
    - pip install --quiet pyyaml
    - python scripts/validate_skills.py
    - python -m py_compile scripts/sync_skills.py scripts/audit.py agent-self-awareness/scripts/detect_model.py context-search/scripts/find_agent_sessions.py token-optimizer/scripts/optimize_agents.py token-optimizer/scripts/test_optimize_agents.py human-writing/scripts/scan.py human-writing/scripts/test_scan.py
    - python -m unittest discover -s token-optimizer/scripts -p 'test_*.py' -v
    - python -m unittest discover -s human-writing/scripts -p 'test_*.py' -v
    - bash -n shell/install.sh shell/shared/agent-skills.sh shell/bash/agent-skills.sh shell/test_sync.sh
    - bash shell/test_sync.sh
    - python scripts/check_changed_writing.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
